# ===================================
# APPLICATION
# ===================================
spring.application.name=tenant-service
server.port=8082

# ===================================
# DATABASE
# ===================================
spring.datasource.url=jdbc:postgresql://localhost:5432/sentinel_tenant
spring.datasource.username=postgres
spring.datasource.password=Qwe.123*
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===================================
# RABBITMQ
# ===================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Tenant Events
tenant.events.exchange=tenant-exchange
tenant.events.created-routing-key=tenant.created
tenant.events.upgraded-routing-key=tenant.plan.upgraded

# ===================================
# MICROSERVICES
# ===================================
services.auth.url=http://localhost:8081
services.billing.url=http://localhost:8080

# ===================================
# LOGGING
# ===================================
logging.level.root=INFO
logging.level.com.sentinel.tenant_service=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Log file
logging.file.name=logs/tenant-service.log
logging.file.max-size=10MB
logging.file.max-history=10